name: Migrate Garmin Global to Garmin CN

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Audit both full activity inventories without uploading
        type: boolean
        default: true
      batch_limit:
        description: Maximum missing activities to upload in this run (1-500)
        type: string
        default: '50'

concurrency:
  group: garmin-global-to-cn-reconciliation
  cancel-in-progress: false

env:
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_GLOBAL_USERNAME: ${{ secrets.GARMIN_GLOBAL_USERNAME }}
  GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
  RECONCILE_DRY_RUN: ${{ inputs.dry_run }}
  RECONCILE_LIMIT: ${{ inputs.batch_limit }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Migrate Garmin Global to Garmin CN
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn --frozen-lockfile
      - run: yarn ts-node src/reconcile_garmin_global_to_cn.ts
